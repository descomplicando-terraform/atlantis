---
- name: Instalar as units do systemd
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - atlantis-env.service
    - atlantis.service
  notify: Recarregar o systemd

- name: Aplicar as units recem-instaladas
  ansible.builtin.meta: flush_handlers

- name: Validar a sintaxe das units
  ansible.builtin.command: systemd-analyze verify atlantis.service atlantis-env.service
  register: unit_verify
  changed_when: false
  failed_when: >-
    'Unknown key' in unit_verify.stderr
    or 'Unknown section' in unit_verify.stderr
    or 'Failed to parse' in unit_verify.stderr

- name: Habilitar as units no boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: stopped
  loop:
    - atlantis-env.service
    - atlantis.service

- name: Garantir que nenhum segredo ficou na imagem
  ansible.builtin.file:
    path: "{{ atlantis_conf_dir }}/atlantis.env"
    state: absent
